name: rafay_store
description: Rafay Store — Demand & Supplier Management App
publish_to: 'none'
version: 1.3.0+4

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.3.0
  firebase_auth: ^5.1.4
  cloud_firestore: ^5.2.1
  firebase_messaging: ^15.0.4
  flutter_local_notifications: ^17.2.2
  provider: ^6.1.2
  go_router: ^14.2.7
  url_launcher: ^6.3.0
  intl: ^0.19.0
  google_fonts: ^6.2.1
  shared_preferences: ^2.3.1
  file_picker: ^8.1.6
  csv: ^6.0.0
  archive: ^4.0.0
  http: ^1.2.2
  cupertino_icons: ^1.0.8
  flutter_markdown: ^0.7.4
  flutter_contacts: ^1.1.9
  permission_handler: ^11.3.1
  speech_to_text: ^7.0.0
  google_sign_in: ^6.2.1
  mobile_scanner: ^5.2.3
  audioplayers: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/sounds/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/logo.png"
  adaptive_icon_background: "#FFD600"
  adaptive_icon_foreground: "assets/images/logo.png"
